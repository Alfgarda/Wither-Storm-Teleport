description='''Teleports the Wither Storm to its tracked target across dimensions once its phase reaches the configured phase (default 4, sub-phases such as 4.2 supported) and it is not distracted, applying Darkness to the target. Segments are moved along with it. Teleport phase, behavior, position, delay, cooldown and distraction handling are configured per source-to-target dimension rule in config/wst.json; when no rule matches, the default general rule applies.'''
